services:
  app:
    build: .
    container_name: course-app
    ports:
      - "8080:8080"
    environment:
      APP_STORE: sqlite
      APP_DB_PATH: /data/data.sql
    volumes:
      - appdata:/data
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-store
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  appdata:
  redisdata: